<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Golden Hand · Contract Dashboard</title>
<style>
:root{--bg:#0a0907;--panel:#131109;--line:#2a2516;--text:#f5f0e2;--muted:#a59d86;--gold:#d8b25a;--gold2:#f3d58a;--good:#7de2a8;--blue:#8fc8ff;--bad:#ff9d8f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#2a2210 0,transparent 60%),var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:1450px;margin:auto;padding:28px}.eyebrow{letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:12px;font-weight:800}
h1{font-size:clamp(28px,4vw,52px);line-height:1;margin:8px 0 10px}.sub{color:var(--muted);max-width:760px}
.top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.goal{padding:14px 18px;border:1px solid #4a3d1a;background:#17130a;border-radius:14px;color:var(--gold2);font-weight:700;max-width:420px}
.goal .gbar{height:8px;background:#2a2312;border-radius:9px;margin-top:10px;overflow:hidden}.goal .gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.hero{display:grid;grid-template-columns:220px 1fr;gap:18px;margin:22px 0;align-items:stretch}
.ring{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.ring svg{width:150px;height:150px}.ring span{color:var(--muted);font-size:12px;margin-top:6px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:12px}
.funnel{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.funnel .fb{display:flex;height:14px;border-radius:9px;overflow:hidden;background:#1d1a10;margin:8px 0}.funnel .lg{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12px}.funnel .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.bar input,.bar select{background:#100e08;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.bar input{min-width:240px;flex:1}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:rgba(19,17,9,.9)}
table{border-collapse:collapse;width:100%;min-width:1180px}th,td{padding:12px 14px;border-bottom:1px solid #221e12;vertical-align:top;text-align:left}
th{position:sticky;top:0;background:var(--panel);color:#c9bf9f;font-size:11px;text-transform:uppercase;letter-spacing:.08em}tr:hover td{background:#191509}
.id{color:var(--gold);font-family:ui-monospace,monospace}.p1{color:#ffd76e;font-weight:800}.p2{color:var(--blue)}.p3{color:#9aa1a6}.rate{font-weight:800;white-space:nowrap}
.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em}
.NEW{background:#262626;color:#d6d6d6}.READY{background:#243a20;color:#bff1ad}.SENT{background:#2b2850;color:#c9c3ff}.REPLIED{background:#443817;color:#ffe49a}.CALL{background:#4d3410;color:#ffc77a}.WON{background:#17442d;color:#99f2c2}.LOST{background:#492222;color:#ffb1b1}
.prog{width:120px}.prog .pb{height:6px;background:#241f12;border-radius:6px;overflow:hidden;margin-top:6px}.prog .pb i{display:block;height:100%;background:var(--gold)}.prog small{color:var(--muted)}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;border:1px solid #3a321c;border-radius:8px;padding:6px 9px;background:#16130a;color:#f1e8cf;cursor:pointer;font:inherit}
.btn.primary{border-color:#7a6224;background:#2b2410;color:#ffe294}.note{max-width:320px;color:#c7bfa8}.foot{margin:16px 2px;color:#8a8270;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* gate */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 500px at 50% 0,#2a2210,transparent 70%),var(--bg);z-index:10}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid #3a321c;border-radius:20px;padding:28px}
.card h2{margin:6px 0 18px;font-size:26px}.card label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.card input{width:100%;background:#0d0b06;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px}
.card button{width:100%;margin-top:18px;padding:12px;border-radius:10px;border:0;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1405;font-weight:900;cursor:pointer;font-size:15px}
.card .err{color:var(--bad);min-height:18px;font-size:13px;margin-top:10px}.card .rm{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}.card .rm input{width:auto}
#app{display:none}
@media(max-width:860px){.wrap{padding:18px}.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="gate"><form class="card" id="login" autocomplete="on">
  <div class="eyebrow">Golden Hand · private</div><h2>Contract Dashboard</h2>
  <label for="u">Username</label><input id="u" name="username" autocomplete="username" required>
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <div class="rm"><input type="checkbox" id="rm" checked><label for="rm" style="margin:0">Keep me signed in on this device</label></div>
  <button type="submit">Unlock</button><div class="err" id="err"></div>
</form></div>

<div id="app"><div class="wrap">
<div class="top"><div><div class="eyebrow">Golden Hand Handyman · powered by AdikAI</div><h1>Contract Dashboard</h1><div class="sub">Live acquisition board for Adam. Pipeline: NEW → READY → SENT → REPLIED → CALL → WON. Updated by <code>/adikai</code>.</div></div>
<div class="goal" id="goal"></div></div>
<div class="hero"><div class="ring" id="ring"></div><div class="stats" id="stats"></div></div>
<div class="bar"><input id="q" placeholder="Search company, role, location…"><select id="priority"><option value="">All priorities</option><option>P1</option><option>P2</option><option>P3</option></select><select id="status"><option value="">All statuses</option><option>NEW</option><option>READY</option><option>SENT</option><option>REPLIED</option><option>CALL</option><option>WON</option><option>LOST</option></select></div>
<div class="tablewrap"><table><thead><tr><th>ID</th><th>Pri</th><th>Company / role</th><th>Location</th><th>Rate</th><th>Type / transport</th><th>Status</th><th>Progress</th><th>Contact</th><th>Action</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="foot"><span id="updated"></span><button class="btn" id="logout">Sign out</button></div>
</div></div>

  $('#ring').innerHTML=ring(avg);
  $('#stats').innerHTML=[
    [L.length,'leads in list'],[`${contacted}/${L.length} · ${Math.round(contacted/n*100)}%`,'contacted'],
    [`${engaged} · ${Math.round(engaged/n*100)}%`,'replied / on a call'],[won,won?'contracts won 🎉':'contracts won']
  ].map(([b,t])=>`<div class="stat"><b>${b}</b><span>${t}</span></div>`).join('')+
  `<div class="funnel"><b>Funnel</b><div class="fb">${Object.keys(STAGE).map(k=>cnt(k)?`<i title="${k}: ${cnt(k)}" style="width:${cnt(k)/n*100}%;background:${COLORS[k]}"></i>`:'').join('')}</div><div class="lg">${Object.keys(STAGE).map(k=>`<span><i style="background:${COLORS[k]}"></i>${k} ${cnt(k)}</span>`).join('')}</div></div>`;
  const gp=won?100:Math.max(...L.map(l=>STAGE[l.status]==100&&l.status!=='WON'?0:(STAGE[l.status]??0)),0);
  $('#goal').innerHTML=`1G · ${esc(data.goal||'Paid London renovation contract')}<div class="gbar"><i style="width:${gp}%"></i></div><small style="color:#a59d86;font-weight:500">Goal ${gp}% — best lead is at ${gp>=80?'CALL':gp>=60?'REPLIED':gp>=40?'SENT':gp>=20?'READY':'NEW'}</small>`;
  const rows=L.filter(l=>(!p||l.priority===p)&&(!s||l.status===s)&&(!q||JSON.stringify(l).toLowerCase().includes(q)));
  $('#rows').innerHTML=rows.map(l=>{const pc=STAGE[l.status]??0;return `<tr><td class="id">${esc(l.id)}</td><td class="${esc((l.priority||'').toLowerCase())}">${esc(l.priority)}</td><td><b>${esc(l.company)}</b><br>${esc(l.job)}</td><td>${esc(l.location)}</td><td class="rate">${esc(l.rate)}</td><td>${esc(l.contract_type)}<br><small>${esc(l.transport)}</small></td><td><span class="status ${esc(l.status)}">${esc(l.status)}</span>${l.date_contacted?`<br><small style="color:#8a8270">${esc(l.date_contacted)}</small>`:''}</td><td class="prog"><small>${l.status==='LOST'?'closed':pc+'%'}</small><div class="pb"><i style="width:${pc}%;${l.status==='LOST'?'background:#c45a5a':''}"></i></div></td><td>${l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a><br>`:''}${l.phone?`<a href="tel:${esc(String(l.phone).split('/')[0].replace(/\s/g,''))}">${esc(l.phone)}</a>`:''}</td><td><div class="actions">${l.email?`<a class="btn primary" href="${mailto(l)}">Email</a>`:''}${l.source?`<a class="btn" href="${esc(l.source)}" target="_blank" rel="noopener">Source ↗</a>`:''}</div></td><td class="note">${esc(l.notes)}</td></tr>`}).join('')||'<tr><td colspan="11">No matches.</td></tr>';
  $('#updated').textContent=`Vault updated: ${data.updated}`;
}
async function unlock(secret,remember){
  data=await decrypt(secret);
  try{(remember?localStorage:sessionStorage).setItem('gh_k',secret)}catch(e){}
  $('#gate').style.display='none';$('#app').style.display='block';render();
}
$('#login').addEventListener('submit',async e=>{e.preventDefault();$('#err').textContent='';
  const secret=$('#u').value.trim().toLowerCase()+':'+$('#p').value;
  try{await unlock(secret,$('#rm').checked)}catch(err){$('#err').textContent='Wrong username or password.'}});
$('#logout').addEventListener('click',()=>{try{localStorage.removeItem('gh_k');sessionStorage.removeItem('gh_k')}catch(e){}location.reload()});
['q','priority','status'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));
(async()=>{let k=null;try{k=localStorage.getItem('gh_k')||sessionStorage.getItem('gh_k')}catch(e){}if(k){try{await unlock(k,!!localStorage.getItem('gh_k'))}catch(e){}}})();
</script>
</body></html>
